<h1 id="pigview-a-minimum-bounding-box-pig-weight-estimation-system-using-artificial-intelligence-deep-learning-%F0%9F%90%B7">PigView: A Minimum Bounding-Box Pig Weight Estimation System Using Artificial Intelligence Deep Learning <img class="emoji" draggable="false" alt="🐷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f437.svg" data-marp-twemoji=""/></h1>
<blockquote>
<p><strong>Technical Specification &amp; System Architecture</strong></p>
<p>本專案提出了一套基於人工智慧深度學習的非接觸式豬隻體重估算系統——<strong>PigView</strong>，專為評估與管理豬舍中豬隻的生長狀況而設計。透過配備模型推論能力的 AI 攝影機，本系統將裝置端邊緣運算 (Edge Computing) 與最佳物件框 (Minimum Bounding Box, MBB) 面積換算技術進行深度整合。</p>
<p>PigView 不僅能輕鬆且具經濟效益地部署於養豬場，解決傳統人工量測費時、費力且具安全隱患的痛點；並透過設立 <strong>辨識熱區 (Region of Interest, ROI)</strong> 作為空間限制條件來篩選有效姿態，成功克服了動物姿態變形所造成的技術干擾。實驗結果表明，本系統能自動且精準地追蹤豬隻體重變化與生長趨勢，協助豬農優化飼養與生產效率，進而達成降低成本與提升收益的極高商業落地價值。</p>
</blockquote>
<h2 id="1-%E7%B3%BB%E7%B5%B1%E6%9E%B6%E6%A7%8B%E8%88%87%E9%82%8A%E7%B7%A3%E9%83%A8%E7%BD%B2-system-architecture">1. 系統架構與邊緣部署 (System Architecture)</h2>
<p>本系統採用「單鏡頭即時推論」架構，以 ARM Cortex-A7 處理器與內建第二代深度學習加速器 (GPDLAv2) 的 GPA7750A SoC 作為運算主體 。整體系統的完整管線 (Pipeline) 如下圖所示：</p>
<p><img src="architecture.png" alt="PigView System Architecture" /></p>
<p><em>(圖 1：PigView 系統之軟硬體整合與單鏡頭即時推論管線圖)</em></p>
<h3 id="11-%E7%A1%AC%E9%AB%94%E8%A6%8F%E6%A0%BC%E8%88%87%E9%82%8A%E7%B7%A3%E6%95%88%E8%83%BD">1.1 硬體規格與邊緣效能</h3>
<p>在邊緣運算場景中，硬體資源往往是最大瓶頸。本專案將嚴苛的硬體限制轉化為架構設計的基準，並達成極佳的效能平衡：</p>
<ul>
<li><strong>極端硬體限制</strong>: 運算核心 GPA7750A 算力上限為 <code>17.32 GFLOPs</code>。內建記憶體 (DDR2) 為 <strong><code>64 MB</code></strong>，且記憶體頻寬僅 <strong><code>1.6 GB/s</code></strong> 。</li>
<li><strong>系統效能</strong>: 本系統穩定維持 <strong>15 FPS</strong> 的推論速度，符合實務農場的即時運算要求。</li>
</ul>
<h2 id="2-%E6%A0%B8%E5%BF%83%E6%8A%80%E8%A1%93%E8%88%87%E7%89%B9%E5%BE%B5%E5%B7%A5%E7%A8%8B-core-methodology">2. 核心技術與特徵工程 (Core Methodology)</h2>
<h3 id="21-%E8%BC%95%E9%87%8F%E5%8C%96%E6%A8%A1%E5%9E%8B%E9%81%B8%E6%93%87%E8%88%87%E7%A1%AC%E9%AB%94-model-selection--hardware-adaptation">2.1 輕量化模型選擇與硬體 (Model Selection &amp; Hardware Adaptation)</h3>
<p>針對邊緣硬體極度受限的運算資源，我們進行了深度學習模型的效能與實用性取捨分析。我們捨棄了龐大的最新網路架構，改為採用 <strong>MobileNetV2-YOLOv3-Lite</strong>：</p>
<table>
<thead>
<tr>
<th>Model</th>
<th>GFLOPs</th>
<th>Model Size</th>
<th>Mem Bandwidth</th>
<th>Compatibility</th>
</tr>
</thead>
<tbody>
<tr>
<td>YOLOv11</td>
<td>160</td>

<td>18 GB/s</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> 不適用</td>
</tr>
<tr>
<td><strong>YOLOv3-Lite</strong></td>

<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>完全適配</strong></td>

</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">graph TD;
    A[專案需求: 即時單豬與群體豬辨識] --&gt; B{邊緣裝置運算資源評估};
    B -- &quot;GFLOPs &gt; 100&quot; --&gt; C[YOLOv11 等先進模型&lt;br&gt;算力溢出, 捨棄];
    B -- &quot;GFLOPs &lt; 5&quot; --&gt; D[選定 MobileNetV2-YOLOv3-Lite];
    D --&gt; E[導入 GPA7750A 進行 64MB 記憶體極限部署];
    E --&gt; F[達成穩定 15 FPS 推論效能];
</code></pre>
<p>儘管 YOLOv11 此類先進模型在整體理論精準度上具備優勢，但其高達 160 GFLOPs 的運算開銷根本無法落地於 64MB 記憶體的邊緣裝置。依據本專案的混淆矩陣實驗結果，MobileNetV2-YOLOv3-Lite 模型對於單一豬隻與群體豬隻兩者的 Recall 值皆高於0.94。</p>
<p><img src="combain.png" alt="MobileNetV2-YOLOv3-Lite &amp; YOLOv11 Confusion Matrix" /></p>
<p><em>(圖 2：左為本專案採用之 MobileNetV2-YOLOv3-Lite 混淆矩陣，右為對照組 YOLOv11。證輕量化模型具高性價比與足夠的 Recall 表現。)</em></p>
<h3 id="22-%E9%9B%A2%E7%B7%9A%E8%B3%87%E6%96%99%E5%A2%9E%E5%BC%B7%E8%88%87%E6%A1%86%E6%9E%B6%E9%99%90%E5%88%B6%E5%85%8B%E6%9C%8D-offline-augmentation-strategy">2.2 離線資料增強與框架限制克服 (Offline Augmentation Strategy)</h3>
<p>為彌補輕量化模型在複雜場景下的先天限制，我們導入了嚴謹的<strong>離線增強 (Offline Augmentation)</strong> 策略，以最大化提升系統的泛化能力。基於本專案採用的 MobileNetV2-YOLOv3-Lite 是建構於底層的 <strong>Darknet 框架</strong> ，其原生的資料載入管線難以直接整合如 Albumentations 等現代化套件來執行高複雜度的動態線上資料增強 (Online Augmentation)。因此，我們果斷採取離線增強策略，預先透過亮度與對比度動態調整、馬賽克混合 (Mosaic) 等幾何與像素級變換，將基準資料大幅擴增至 20,000 張。此工程決策不僅解決了框架限制，更確保模型在真實豬舍的光影變化與環境雜訊中，依然能精準鎖定豬隻輪廓，提供穩定可靠的面積換算基準。</p>
<h3 id="23-mbb-%E5%96%AE%E4%B8%80%E8%B1%AC%E9%9A%BB%E8%B3%87%E6%96%99%E9%9B%86%E5%BB%BA%E7%BD%AE%E8%88%87%E8%87%AA%E5%8B%95%E5%8C%96%E6%A8%99%E8%A8%BB-mbb-single-pig-dataset-construction">2.3 MBB 單一豬隻資料集建置與自動化標註 (MBB Single-Pig Dataset Construction)</h3>
<p>本專案將未與其他個體重疊之影像定義為「<strong>單一豬隻 (Single-Pig)</strong>」。為突破傳統人工標註的效率瓶頸，本研究自主開發 <strong>LabelMini</strong> 自動化標註工具，專用於精準擷取能完美包覆豬隻軀幹的「<strong>最小物件框 (Minimum Bounding Box, MBB)</strong>」。</p>
<p>針對單豬影像，LabelMini 會依序執行影像處理管線：<strong>灰階轉換 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> 高斯模糊 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> 二值化 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> 邊緣檢測</strong>，以精確提取目標外觀輪廓。鎖定邊緣後，系統自動演算並生成具備「面積絕對最小」數學特性的矩形框 (MBB)。藉由此自動化流程，本專案得以極高效率大規模建構高準確度的單豬 MBB 資料集。</p>
<p>最終，本系統採用 <strong>MobileNetV2-YOLOv3-Lite</strong> 作為核心模型 (Core Model)，並融合上述單豬與群體豬資料集進行聯合訓練，確保模型能精準偵測並適應落入 <strong>ROI (辨識熱區)</strong> 內的各類目標狀態，大幅強化實務場域之泛化能力。</p>
<h3 id="24-%E9%9D%A2%E7%A9%8D%E8%88%87%E7%89%A9%E7%90%86%E9%AB%94%E9%87%8D%E6%98%A0%E5%B0%84%E6%A8%A1%E5%9E%8B-area-to-weight-mapping">2.4 面積與物理體重映射模型 (Area-to-Weight Mapping)</h3>

<p>為確保面積計算的穩定性，LabelMini 自動化標註管線的核心處理邏輯如下所示：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> cv2
<span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

<span class="hljs-keyword">def</span> <span class="hljs-title function_">extract_mbb</span>(<span class="hljs-params">image_path</span>):
    <span class="hljs-comment"># 1. 灰階與高斯去噪</span>
    img = cv2.imread(image_path, cv2.IMREAD_GRAYSCALE)
    blurred = cv2.GaussianBlur(img, (<span class="hljs-number">5</span>, <span class="hljs-number">5</span>), <span class="hljs-number">0</span>)
    
    <span class="hljs-comment"># 2. Otsu 二值化與形態學處理 (去除泥污干擾)</span>
    _, binary = cv2.threshold(blurred, <span class="hljs-number">0</span>, <span class="hljs-number">255</span>, cv2.THRESH_BINARY + cv2.THRESH_OTSU)
    kernel = np.ones((<span class="hljs-number">3</span>,<span class="hljs-number">3</span>), np.uint8)
    clean_binary = cv2.morphologyEx(binary, cv2.MORPH_OPEN, kernel)
    
    <span class="hljs-comment"># 3. 邊緣檢測與最小物件框 (MBB) 生成</span>
    contours, _ = cv2.findContours(clean_binary, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)
    largest_contour = <span class="hljs-built_in">max</span>(contours, key=cv2.contourArea)
    x, y, w, h = cv2.boundingRect(largest_contour)
    
    <span class="hljs-keyword">return</span> (x, y, w, h) <span class="hljs-comment"># 回傳 MBB 座標與尺寸</span>
</code></pre>
<h2 id="3-%E7%B3%BB%E7%B5%B1%E9%99%90%E5%88%B6%E8%A8%AD%E8%A8%88%E8%88%87%E5%AF%A6%E5%8B%99%E8%80%83%E9%87%8F-system-defense--domain-knowledge">3. 系統限制設計與實務考量 (System Defense &amp; Domain Knowledge)</h2>
<p>豬隻若呈現側躺或蜷縮等非標準姿勢，勢必導致面積失真與體重計算誤差。針對此技術限制，本專案捨棄了極度耗費算力的複雜演算法，轉而採用結合場域實務的最佳系統設計來解決：</p>
<h3 id="31-%E7%A9%BA%E9%96%93%E9%99%90%E5%88%B6%E8%88%87-roi-%E8%BE%A8%E8%AD%98%E7%86%B1%E5%8D%80">3.1 空間限制與 <strong>ROI 辨識熱區</strong></h3>
<p>我們在 AI 攝影機中，建立了一個狹長型的 <strong>ROI(Region of Interest) 辨識熱區</strong>。此物理空間設計強制系統<strong>僅在豬隻「正向走入並直立通過」該熱區時，系統才會量測豬隻體重</strong>。透過這道物理限制，系統從最源頭直接排除了蜷縮、側躺等會導致面積計算誤差的無效姿勢，確保寫入資料庫的特徵皆具備高度的一致性與可靠度。</p>
<h3 id="32-%E9%A4%8A%E6%AE%96%E5%AF%A6%E5%8B%99%E8%80%83%E9%87%8F">3.2 養殖實務考量**</h3>
<p>針對「ROI 條件嚴苛可能導致每日成功記錄的樣本數較少」之疑慮，我們結合了第一線養豬場的管理經驗，確立了此一設計在真實場域中的高度合理性：</p>
<ol>
<li><strong>自動化量測的實務效益</strong>：傳統人工秤重極度耗時費力，且強制驅趕易引發豬隻嚴重的生理緊迫，進而影響健康與肉質。對農場管理者而言，只要系統能「每日自動記錄到部分數據」，就已經大幅省下了勞動力成本，實務上完全不需要強求 100% 的全時無差別追蹤。</li>
<li><strong>豬圈群體生長一致性 (Pen-Level Growth Consistency)</strong>：依據養殖實務經驗，同一豬圈內飼養的豬隻由於採食條件與環境相同，其生長曲線具備高度一致性。因此，即使系統在 ROI 熱區內對同一隻頻繁走動的豬隻進行重複取樣，在統計學上（大數法則）反而能進一步平滑化單次量測的誤差，產生極度穩定的「豬圈平均生長趨勢線」。對農場目前的管理目標而言，掌握此群體趨勢已足以準確評估生長狀況。</li>
<li><strong>模組化個體追蹤升級 (Modular Upgrade Path)</strong>：雖然目前合作農場以群體趨勢評估為主，但本系統架構已預留擴充彈性。未來若針對種豬或高價值個體有精細化管理需求，系統可無縫整合邊緣端目標追蹤演算法或結合實體 RFID 標籤，以達成從「群體平均估測」到「單一個體履歷」的全方位升級。</li>
</ol>
<h2 id="4-%E5%AF%A6%E9%A9%97%E7%B5%90%E6%9E%9C%E8%88%87%E6%95%88%E8%83%BD%E8%A9%95%E4%BC%B0-empirical-results">4. 實驗結果與效能評估 (Empirical Results)</h2>
<h3 id="41-%E7%89%A9%E4%BB%B6%E6%A1%86%E5%B0%BA%E5%AF%B8%E6%AF%94%E8%BC%83%E5%AF%A6%E9%A9%97mbb-%E4%B9%8B%E6%BA%96%E7%A2%BA%E5%BA%A6%E9%A9%97%E8%AD%89">4.1 物件框尺寸比較實驗：MBB 之準確度驗證</h3>
<p>為驗證「精確的物件框尺寸對體重估算的影響」，我們進行了不同框選策略的比較實驗。下圖展示了 MobileNetV2-YOLOv3-Lite 模型分別針對 MBB（精準框）、MBB-（縮小框）與 MBB+（放大框）單豬數據集預測後的效能對比。</p>
<p>本實驗採用交集比聯集 (Intersection over Union, IoU) 作為性能指標，用以衡量預測物件框與實際標註框之間的重疊程度。實驗數據明確指出：在隨機抽樣的 30 筆測試樣本中，僅有基於 MBB 訓練的模型能將 IoU 穩定收斂至接近 1.0 的極高水準；反之，只要框選面積偏移基準，預測準確度皆呈現高度不穩定的震盪。這從數據層面給出了實證：<strong>精準貼合的 MBB 是面積計算準確度的最佳測量基準</strong>。</p>

<h3 id="42-%E5%AF%A6%E5%8B%99%E5%A0%B4%E5%9F%9F%E5%8B%95%E6%85%8B%E9%AB%94%E9%87%8D%E9%A0%90%E4%BC%B0%E9%A9%97%E8%AD%89-3-week-tracking">4.2 實務場域動態體重預估驗證 (3-Week Tracking)</h3>
<p>為確保系統的穩定性，本實驗採用固定高度與俯視角的攝影機架設方式。針對不同豬舍的環境差異，系統可透過擴充不同相機高度的基準資料集，並於現場部署時利用設定檔切換對應參數，以兼顧邊緣運算的輕量化與跨場域的適應性。<br />
為驗證系統於實際農場環境之時間推移泛化能力，我們於合作養豬場隨機抽樣 10 隻豬隻（初始約 50 公斤），進行為期三週的連續追蹤實驗。</p>

<h2 id="5-%E5%B0%88%E6%A1%88%E9%87%8C%E7%A8%8B%E7%A2%91%E8%88%87%E5%BE%8C%E7%BA%8C%E8%A1%8C%E5%8B%95-milestones">5. 專案里程碑與後續行動 (Milestones)</h2>
<p><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> 已達成里程碑 (Completed)</strong></p>
<ul>
<li>
<p>[x] <strong>場域驗證與落地</strong>：完成屏東合作養豬場之實地部署與場域驗證，證實系統具備極高之商業價值。</p>
</li>
<li>

<ul>
<li data-marpit-fragment="1">

<li data-marpit-fragment="2">
